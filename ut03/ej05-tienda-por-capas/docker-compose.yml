# MySQL propio del ej05: base `tienda` con la tabla `producto` ya cargada.
# Uso: cp .env.example .env, cambia DB_PASSWORD y ejecuta `docker compose up -d --wait`.
# Usa el puerto 3307 por defecto para no chocar con el contenedor de la UT2 (3306).
name: dwes-ut03-ej05
services:
  mysql:
    image: mysql:8.4
    container_name: dwes-ut03-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?Falta .env o una variable vacía: copia .env.example a .env y escribe tu clave}"
      MYSQL_DATABASE: tienda
      MYSQL_USER: "${DB_USER:?Falta .env o una variable vacía: copia .env.example a .env y escribe tu clave}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Falta .env o una variable vacía: copia .env.example a .env y escribe tu clave}"
    ports:
      # Solo accesible desde tu propio equipo.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      # Los datos viven en un volumen con nombre: sobreviven a `docker compose down`.
      # Solo `docker compose down -v` los borra (y vuelve a cargar los 8 productos iniciales).
      - datos:/var/lib/mysql
      - ./bd:/docker-entrypoint-initdb.d:ro
    # healthcheck: Docker repite esta comprobación hasta que MySQL responde; `--wait` espera a que salga bien.
    healthcheck:
      # Sin contraseña a propósito: así no se escribe la clave en el comando del healthcheck.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  datos:
